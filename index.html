<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#efe7dc"
    >

    <title>Our Day 🤍</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="page">

    <!-- Background -->
    <div class="background"></div>

    <!-- Arch -->
    <img
        src="images/arch.png"
        class="arch"
        alt=""
    >

    <!-- Side Flowers -->
    <img
        src="images/flowers-left.png"
        class="side-flower flowers-left"
        alt=""
    >

    <img
        src="images/flowers-right.png"
        class="side-flower flowers-right"
        alt=""
    >

    <!-- Top Section -->
    <section class="top-section">

        <img
            src="images/is.svg"
            class="names-logo"
            alt="عيسى وسارة"
        >

        <img
            src="images/leaves-divider.png"
            class="divider"
            alt=""
        >

        <p
            id="countdown-message"
            class="message"
        >
            يومنا صار أقرب 🤍
        </p>

    </section>

    <!-- Countdown -->
    <section class="countdown-section">

        <div class="countdown">

            <div class="count-box">
                <span id="days">00</span>
                <small>يوم</small>
            </div>

            <div class="count-box">
                <span id="hours">00</span>
                <small>ساعة</small>
            </div>

            <div class="count-box">
                <span id="minutes">00</span>
                <small>دقيقة</small>
            </div>

            <div class="count-box">
                <span id="seconds">00</span>
                <small>ثانية</small>
            </div>

        </div>

    </section>

    <!-- Couple -->
    <div class="couple">

        <img
            src="images/groom.png"
            class="groom"
            alt=""
        >

        <img
            src="images/bride.png"
            class="bride"
            alt=""
        >

    </div>

    <!-- Date Card -->
    <section class="date-card">

        <span class="day-name">
            الأربعاء
        </span>

        <span class="full-date">
            09 · 09 · 2026
        </span>

        <div class="date-line">

            <span></span>

            <b>
                ♡
            </b>

            <span></span>

        </div>

        <span class="time">
            ◷ 6:30 PM
        </span>

    </section>

    <!-- Bottom Flowers -->
    <img
        src="images/flowers-bottom-left.png"
        class="bottom-flower bottom-left"
        alt=""
    >

    <img
        src="images/flowers-bottom-right.png"
        class="bottom-flower bottom-right"
        alt=""
    >

    <!-- Last 10 Seconds -->
    <div
        id="last-seconds-screen"
        class="last-seconds-screen"
    >

        <p>
            باقي على يومنا
        </p>

        <span id="last-number">
            10
        </span>

    </div>

    <!-- Final Screen -->
    <div
        id="final-screen"
        class="final-screen"
    >

        <div class="final-content">

            <img
                src="images/is.svg"
                class="final-names"
                alt=""
            >

            <img
                src="images/leaves-divider.png"
                class="final-divider"
                alt=""
            >

            <h1>
                وأخيرًا…
            </h1>

            <p>
                جاء يومنا 🤍
            </p>

            <span>
                09 · 09 · 2026
            </span>

        </div>

    </div>

</main>

<script src="script.js"></script>

</body>
</html>
